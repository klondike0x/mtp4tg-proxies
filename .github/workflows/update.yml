name: Update mtp4tg Proxies

on:
  schedule:
    - cron: '0 */12 * * *'  # 🕒 Каждые 12 часов (00:00 и 12:00 UTC)
  workflow_dispatch:       # Кнопка ручного запуска (Run workflow)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install requests
        run: pip install requests
        
      - name: Collect proxies
        run: python scripts/collect.py
        
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add all_proxies.* 
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "🔄 Update $(date '+%Y-%m-%d %H:%M') UTC" && git push)
